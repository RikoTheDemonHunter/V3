name: Metrics
on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: RikoTheDemonHunter
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Enable WakaTime stats (requires WAKATIME_TOKEN secret)
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 365
          plugin_wakatime_sections: time, projects, languages, editors, os
          
          # Enable Languages breakdown
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
